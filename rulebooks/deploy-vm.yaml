- name: Launch workflow when webhook received
  hosts: localhost
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
  rules:
    - name: Run workflow with variables
      condition: event.payload.host_id is defined
      actions:
        - run_workflow_template:
            name: "wkf-deploy-vm"
            organization: "Default"
            job_args:
              extra_vars:
                host_id: "{{ event.payload.host_id }}"
